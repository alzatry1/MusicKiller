name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install WDK (10.0.22621)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2196230" -OutFile "$env:TEMP\wdksetup.exe"
          $p = Start-Process -FilePath "$env:TEMP\wdksetup.exe" -ArgumentList "/features + /quiet /norestart" -Wait -PassThru
          Write-Host "wdksetup exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "wdksetup failed with $($p.ExitCode)" }

      - name: Install WDK Visual Studio extension
        shell: pwsh
        run: |
          $vsix = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Vsix\VS2022" -Recurse -Filter "WDK.vsix" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $vsix) {
            Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Vsix" -Recurse -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
            throw "WDK.vsix not found"
          }
          $installer = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\IDE\VSIXInstaller.exe"
          $p = Start-Process -FilePath $installer -ArgumentList "/q", "`"$($vsix.FullName)`"" -Wait -PassThru
          Write-Host "VSIXInstaller exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 1001) { throw "VSIXInstaller failed with $($p.ExitCode)" }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build driver + loader
        run: msbuild MusicKiller.sln /p:Configuration=Release /p:Platform=x64 /m /v:m /nologo

      - name: Test-sign the driver
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=MusicKiller Test Certificate" `
                    -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(5) -KeyExportPolicy Exportable
          $pwd = ConvertTo-SecureString -String "musickiller-test" -Force -AsPlainText
          $pfx = Join-Path $env:RUNNER_TEMP "mk-test-cert.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $pwd | Out-Null
          # Import the test cert into the machine Trusted Root so that
          # "signtool verify /pa" can build a trusted chain on the runner.
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\LocalMachine\Root -Password $pwd | Out-Null
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" |
                        Where-Object { $_.FullName -match "\\x64\\" } |
                        Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          $sys = Get-ChildItem -Path . -Recurse -Filter "MusicKiller.sys" | Select-Object -First 1
          if (-not $sys) { throw "MusicKiller.sys not found" }
          Write-Host "Signing $($sys.FullName) with $($signtool.FullName)"
          & $signtool.FullName sign /fd SHA256 /f $pfx /p "musickiller-test" /t http://timestamp.digicert.com $sys.FullName
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Timestamp signing failed, retrying without timestamp"
            & $signtool.FullName sign /fd SHA256 /f $pfx /p "musickiller-test" $sys.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          }
          & $signtool.FullName verify /pa $sys.FullName

      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path out -Force | Out-Null
          Copy-Item (Get-ChildItem -Path . -Recurse -Filter "MusicKiller.sys" | Select-Object -First 1).FullName out\
          Copy-Item (Get-ChildItem -Path . -Recurse -Filter "mkctl.exe" -File |
                       Where-Object { $_.FullName -match "Release" } | Select-Object -First 1).FullName out\
          Copy-Item (Get-ChildItem -Path . -Recurse -Filter "MusicKiller.exe" -File |
                       Where-Object { $_.FullName -match "Release" } | Select-Object -First 1).FullName out\
          Copy-Item README.md out\README.md
          Get-ChildItem out | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicKiller-x64
          path: out/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} .\out\MusicKiller.exe .\out\MusicKiller.sys .\out\mkctl.exe .\out\README.md `
            --title "MusicKiller ${{ github.ref_name }}" --generate-notes
